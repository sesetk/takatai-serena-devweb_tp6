<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Réducteur d'URL</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      input,
      button {
        padding: 0.6rem;
        font-size: 1rem;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      #error {
        color: #b00020;
      }
      #result {
        margin-top: 1.5rem;
      }
      #short-link {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Réducteur d'URL</h1>

      <form id="submit-link">
        <label for="url">Type the URL to shorten</label>
        <input
          name="url"
          id="url"
          type="url"
          placeholder="https://perdu.com"
          required
        />
        <button type="submit" id="submit-button">Submit</button>
      </form>

      <p id="error" role="alert" hidden></p>

      <section id="result" aria-live="polite" hidden>
        <p>Lien créé :</p>
        <p><a id="short-link" href="#"></a></p>
        <button type="button" id="copy-button">Copier l'URL</button>
        <span id="copy-feedback"></span>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
